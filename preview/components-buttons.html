<!doctype html>
<!-- @dsCard group="Components" name="Components · Buttons" subtitle="Primary, ghost, link · default + hover" viewport="700x180" --><html><head><meta charset="utf-8"><title>Buttons</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <button style="background:var(--ink);color:var(--cream);border:0;padding:14px 22px;font-family:var(--sans);font-size:14px;font-weight:500;letter-spacing:0.04em;cursor:pointer">Reserve a seat</button>
    <button style="background:transparent;color:var(--ink);border:1px solid var(--ink);padding:13px 22px;font-family:var(--sans);font-size:14px;font-weight:500;letter-spacing:0.04em;cursor:pointer">See the calendar</button>
    <a style="font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink);border-bottom:1px solid var(--ink-faint);padding-bottom:2px">Write to Noom &nbsp;→</a>
  </div>
  <div style="display:flex;gap:14px;align-items:center;margin-top:18px">
    <button style="background:#000;color:var(--cream);border:0;padding:14px 22px;font-family:var(--sans);font-size:14px;font-weight:500;letter-spacing:0.04em">Reserve a seat</button>
    <button style="background:var(--cream-deep);color:var(--ink);border:1px solid var(--ink);padding:13px 22px;font-family:var(--sans);font-size:14px;font-weight:500;letter-spacing:0.04em">See the calendar</button>
    <a style="font-family:var(--serif);font-style:italic;font-size:18px;color:var(--clay);border-bottom:1px solid var(--clay);padding-bottom:2px">Write to Noom &nbsp;→</a>
  </div>
  <p class="label" style="margin-top:16px">Buttons · primary, ghost, link · default · hover (ink → black, link → clay)</p>
</div></body></html>
