<!doctype html><html><head><meta charset="utf-8"><title>Voice</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:32px">
    <div>
      <div style="font-family:var(--sans);font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--sage);margin-bottom:8px">We say</div>
      <div style="font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.55;color:var(--ink)">Sound, slowly. We gather at sunset, near the water.</div>
    </div>
    <div>
      <div style="font-family:var(--sans);font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ember);margin-bottom:8px">We don't</div>
      <div style="font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.55;color:var(--ink-mute);text-decoration:line-through;text-decoration-color:var(--ink-faint)">Unlock your sonic journey. Curated immersive vibes.</div>
    </div>
  </div>
  <p class="label" style="margin-top:18px">Voice · sentence case · we / you · no emoji · em-dashes welcome · short, breathing sentences</p>
</div></body></html>
