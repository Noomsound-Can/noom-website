<!doctype html><html><head><meta charset="utf-8"><title>Calendar row</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <article style="display:grid;grid-template-columns:140px 1fr;gap:32px;align-items:baseline;padding:24px 0;border-top:1px solid var(--ink-faint);border-bottom:1px solid var(--ink-faint)">
    <div>
      <div style="font-family:var(--serif);font-weight:300;font-size:72px;line-height:0.92;letter-spacing:-0.01em;color:var(--ink)">11</div>
      <div style="font-family:var(--sans);font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ink-mute);margin-top:10px">Apr · Fri</div>
    </div>
    <div>
      <div style="font-family:var(--sans);font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ink-mute);margin-bottom:10px">Free · weekly</div>
      <div style="font-family:var(--serif);font-weight:400;font-size:26px;color:var(--ink)">Sound &amp; movement gathering</div>
      <div style="font-family:var(--serif);font-style:italic;font-size:16px;color:var(--ink-soft);margin-top:8px">Lamai cliffs, 6:30 pm. Bring a cushion.</div>
      <div style="font-family:var(--sans);font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ink-mute);margin-top:10px">Free · simply arrive</div>
    </div>
  </article>
  <p class="label" style="margin-top:14px">Calendar row · big numeral, kind, title, italic note, price meta — no per-row CTA</p>
</div></body></html>
