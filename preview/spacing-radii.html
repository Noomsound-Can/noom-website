<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Radii & Shadows" subtitle="Square by default · pill only for audio" viewport="700x200" --><html><head><meta charset="utf-8"><title>Radii & shadows</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:flex;gap:24px;align-items:flex-end">
