<!doctype html><html><head><meta charset="utf-8"><title>Card</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
    <div style="border:1px solid var(--ink-faint);padding:24px;background:var(--cream)">
      <div style="font-family:var(--sans);font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ink-mute)">Lessons</div>
      <div style="font-family:var(--serif);font-size:26px;line-height:1.15;margin-top:10px">One-to-one handpan</div>
      <div style="font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-soft);margin-top:8px;line-height:1.55">Begin where you are. Sixty minutes, by the water.</div>
      <div style="font-family:var(--sans);font-size:13px;color:var(--ink);margin-top:18px">฿1,800 · 60 min</div>
    </div>
    <div style="border:1px solid var(--ink);padding:24px;background:var(--cream)">
      <div style="font-family:var(--sans);font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ink-mute)">Sessions</div>
      <div style="font-family:var(--serif);font-size:26px;line-height:1.15;margin-top:10px">Sound therapy</div>
      <div style="font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink-soft);margin-top:8px;line-height:1.55">Lie back. Listen. Let the room do its work.</div>
      <div style="font-family:var(--sans);font-size:13px;color:var(--ink);margin-top:18px">฿2,400 · 75 min</div>
    </div>
  </div>
  <p class="label" style="margin-top:14px">Card · 1px hairline border, square corners, no shadow · hover deepens border to ink</p>
</div></body></html>
