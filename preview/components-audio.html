<!doctype html><html><head><meta charset="utf-8"><title>Audio</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div style="display:flex;align-items:center;gap:16px;border-top:1px solid var(--ink-faint);border-bottom:1px solid var(--ink-faint);padding:18px 0">
    <button aria-label="play" style="width:44px;height:44px;border-radius:999px;background:var(--ink);color:var(--cream);border:0;display:grid;place-items:center;cursor:pointer">
      <svg width="14" height="14" viewBox="0 0 14 14"><polygon points="3,2 12,7 3,12" fill="currentColor"/></svg>
    </button>
    <div style="flex:1">
      <div style="font-family:var(--serif);font-size:18px;color:var(--ink)">Sunset, slowly · D minor</div>
      <div style="font-family:var(--sans);font-size:12px;letter-spacing:0.04em;color:var(--ink-mute);margin-top:2px">3:42 · recorded at Lamai, March 2026</div>
    </div>
    <div style="font-family:var(--mono);font-size:12px;color:var(--ink-soft)">00:42 / 03:42</div>
  </div>
  <p class="label" style="margin-top:14px">Audio preview · the only place a pill (play button) appears in the system</p>
</div></body></html>
