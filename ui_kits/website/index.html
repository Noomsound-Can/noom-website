<!doctype html>
<!-- @dsCard group="UI Kit — Website" name="Website · Homepage" subtitle="Full marketing site composed from kit components" viewport="1280x900" -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Noom Sound Studio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <style>
    body { margin: 0; }
    .reveal { opacity: 0; transform: translateY(20px); transition: opacity 900ms var(--ease-slow), transform 900ms var(--ease-slow); }
    .reveal.in { opacity: 1; transform: none; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { Nav, Hero, Intro, Calendar, Sessions, Audio, About, Footer } = window.NoomSoundStudioDesignSystem_ffadb8;
    function App() {
      React.useEffect(() => {
        const io = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
        }, { threshold: 0.12 });
        document.querySelectorAll('.reveal').forEach(el => io.observe(el));
        return () => io.disconnect();
      }, []);
      return (
        <div data-screen-label="Homepage">
          <Nav />
          <Hero />
          <Intro />
          <Calendar />
          <Sessions />
          <Audio />
          <About />
          <Footer />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
