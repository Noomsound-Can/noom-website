<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Noom Sound Studio</title>
<link rel="stylesheet" href="colors_and_type.css"/>
<style>
html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.tile{display:grid;grid-template-columns:1fr 320px;width:1280px;height:854px}
.main{background:var(--cream);display:flex;align-items:center;justify-content:center}
.main .mark{font-family:var(--serif);font-style:italic;font-weight:300;font-size:150px;color:var(--ink);letter-spacing:0.02em;white-space:nowrap}
.strip{display:grid;grid-template-rows:1fr 1fr 1fr 1fr}
</style>
</head>
<body>
<div class="tile">
<div class="main"><span class="mark">Noom</span></div>
<div class="strip">
<div style="background:#C9A77D"></div>
<div style="background:#B57A55"></div>
<div style="background:#7E8A6E"></div>
<div style="background:#2A2622"></div>
</div>
</div>
</body>
</html>
