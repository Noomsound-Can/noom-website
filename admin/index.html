<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bookings | Noom admin</title>
<!-- Repo-only page, never authored in Claude Design. Behind Cloudflare Access. -->
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.ico" sizes="32x32" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<meta name="theme-color" content="#f5efe6" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="../page.css" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>
<header class="nm-head">
<a class="nm-brand" href="./"><span class="nm-noom">Noom</span><span class="nm-sub">Bookings</span></a>
<button type="button" class="nm-refresh" id="refresh" aria-label="Refresh">Refresh</button>
</header>

<main class="nm-main" id="main">
<div class="nm-notice" id="notice" role="status" aria-live="polite" hidden></div>

<section class="nm-sec" id="waitingSec" hidden aria-labelledby="hWaiting">
<h2 class="nm-h" id="hWaiting">Waiting for you</h2>
<p class="nm-lede">Requests on hold. Message the guest, then confirm or decline.</p>
<div id="waiting"></div>
</section>

<section class="nm-sec" aria-labelledby="hDays">
<div class="nm-sec-head">
<h2 class="nm-h" id="hDays">Next 30 days</h2>
<label class="nm-toggle"><input type="checkbox" id="showAll" /> Show cancelled</label>
</div>
<div id="days"><p class="nm-quiet">Loading&hellip;</p></div>
</section>

<p class="nm-me" id="me"></p>
</main>

<script src="admin.js"></script>
</body>
</html>
